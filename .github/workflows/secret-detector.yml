name: Secret Scanner

on: 
  workflow_call:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks Scan
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true # So we can run the next step
      - name: Create Issue on Leak
        if: steps.gitleaks.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "🚨 Critical: Secret Leaked in Code",
              body: "The automated scanner found a potential API key or secret. Please rotate the key immediately and remove it from the history."
            })