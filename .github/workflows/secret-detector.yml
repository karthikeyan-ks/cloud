name: Secret Scanner

on: 
  workflow_call:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: 
          fetch-depth: 0 

      - name: Gitleaks Scan
        id: gitleaks
        # We use --exit-code 1 to ensure the step fails if a secret is found
        run: |
          docker run -v ${{ github.workspace }}:/path zricethezav/gitleaks:latest detect --source="/path" --no-git --exit-code 1 --verbose
        continue-on-error: true 

      - name: Create Issue on Leak
        # This checks if the Gitleaks command exited with an error code (secrets found)
        if: steps.gitleaks.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "🚨 Critical: Secret Leaked in Code",
              body: "The automated scanner (Gitleaks) found a potential API key, secret, or forbidden .env file. \n\n**Action Required:** \n1. Check the Actions log for the specific leak. \n2. Rotate the leaked key immediately. \n3. Remove the file from the repository history."
            })

      - name: Check for .env files anywhere
        id: env_check
        shell: bash
        run: |
          # This searches the whole repo for any file ending in .env
          FOUND=$(find . -name "*.env" -not -path "*/node_modules/*")
          if [ -n "$FOUND" ]; then
            echo "found_env=true" >> $GITHUB_OUTPUT
            echo "::warning::Found .env file(s) at: $FOUND"
          else
            echo "found_env=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Issue if .env or Leak Found
        # Trigger if the find command found a file OR if gitleaks failed
        if: steps.env_check.outputs.found_env == 'true' || steps.gitleaks.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "🚨 Security Alert: Secret/Env File Detected",
              body: "The scanner found a .env file or a hardcoded secret in your repository. \n\n**Detected items:** \n- Check the 'Check for .env files anywhere' step logs. \n- Check Gitleaks output."
            })