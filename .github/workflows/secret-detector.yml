name: Secret Scanner

on: 
  workflow_call:

jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      found_env: ${{ steps.env_check.outputs.found_env }}
      gitleaks_failed: ${{ steps.gitleaks.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v4
        with: 
          fetch-depth: 0 

      - name: Gitleaks Scan
        id: gitleaks
        # Mapping the workspace ensures it sees config/.env
        run: |
          docker run -v ${{ github.workspace }}:/path zricethezav/gitleaks:latest detect --source="/path" --no-git --exit-code 1 --verbose
        continue-on-error: true 

      - name: Check for .env files anywhere
        id: env_check
        shell: bash
        run: |
          FOUND=$(find . -name "*.env" -not -path "*/node_modules/*")
          if [ -n "$FOUND" ]; then
            echo "found_env=true" >> $GITHUB_OUTPUT
            echo "::warning::Found .env file(s) at: $FOUND"
          else
            echo "found_env=false" >> $GITHUB_OUTPUT
          fi

  # This job only runs if a leak was found or a .env exists
  report:
    needs: scan
    if: |
      always() && 
      (needs.scan.outputs.found_env == 'true' || needs.scan.outputs.gitleaks_failed == 'true')
    uses: ./.github/workflows/issue-creator.yml
    with:
      title: "🚨 Security Alert: Secret/Env File Detected"
      message: "The scanner found a .env file or a hardcoded secret in your repository. Please check the 'scan' job logs for the specific file path and rotate any leaked keys."