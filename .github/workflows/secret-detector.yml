name: Secret Scanner

on: 
  workflow_call:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: 
          fetch-depth: 0 

      - name: Gitleaks Scan
        id: gitleaks
        # We use --exit-code 1 to ensure the step fails if a secret is found
        run: |
          docker run -v ${{ github.workspace }}:/path zricethezav/gitleaks:latest detect --source="/path" --no-git --exit-code 1 --verbose
        continue-on-error: true 

      - name: Create Issue on Leak
        # This checks if the Gitleaks command exited with an error code (secrets found)
        if: steps.gitleaks.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "🚨 Critical: Secret Leaked in Code",
              body: "The automated scanner (Gitleaks) found a potential API key, secret, or forbidden .env file. \n\n**Action Required:** \n1. Check the Actions log for the specific leak. \n2. Rotate the leaked key immediately. \n3. Remove the file from the repository history."
            })
            
      - name: Check for existence of .env
        id: env_check
        run: |
          if [ -f .env ]; then
            echo "found_env=true" >> $GITHUB_OUTPUT
            echo "::warning::Found a .env file! This should not be in the repo."
          else
            echo "found_env=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Issue if .env file exists
        if: steps.env_check.outputs.found_env == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "🚨 Security Risk: .env file detected",
              body: "A `.env` file was found in the repository root. Please remove it and add it to `.gitignore` immediately."
            })