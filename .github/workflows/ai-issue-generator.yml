name: AI Review & Issue Bot
on:
  workflow_call:
  
jobs:
  ai_review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issue: write
      pull_request: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: AI Code Review
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./.github/scripts/ai-review-capture.js');
            await script({github, context, core});
