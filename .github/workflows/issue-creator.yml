name: Issue Notifier

on:
  workflow_call:
    inputs:
      title:
        required: true
        type: string
      message:
        required: true
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Handle Issue
        uses: actions/github-script@v7
        env:
          ISSUE_TITLE: ${{ inputs.title }}
          ISSUE_MESSAGE: ${{ inputs.message }}
        with:
          script: |
            const { ISSUE_TITLE, ISSUE_MESSAGE } = process.env;
            const commitSha = context.sha;
            const actor = context.actor; // This is the person who pushed the code
            
            // 1. Search for an existing open issue
            const searchQuery = `repo:${context.repo.owner}/${context.repo.repo} type:issue state:open in:title "${ISSUE_TITLE}"`;
            const searchResult = await github.rest.search.issuesAndPullRequests({
              q: searchQuery,
            });

            if (searchResult.data.total_count > 0) {
              const existingIssueNumber = searchResult.data.items[0].number;
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssueNumber,
                body: `⚠️ **Re-detected** in commit ${commitSha} by @${actor}.\n\n${ISSUE_MESSAGE}`
              });
            } else {
            // 2. Create new issue and ASSIGN it to the actor
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: ISSUE_TITLE,
              assignees: [actor], // <--- This assigns the issue
              body: `Initial detection in commit ${commitSha} by @${actor}.\n\n${ISSUE_MESSAGE}`
            });