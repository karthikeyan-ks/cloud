name: Issue Notifier

on:
  workflow_call:
    inputs:
      title:
        required: true
        type: string
      message:
        required: true
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Handle Issue
        uses: actions/github-script@v7
        env:
          ISSUE_TITLE: ${{ inputs.title }}
          ISSUE_MESSAGE: ${{ inputs.message }}
        with:
          script: |
            const script = require('./.github/scripts/issue-handler.js');
            await script({github, context, core})