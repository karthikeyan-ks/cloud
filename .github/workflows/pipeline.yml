name: Node js CI/CD pipeline

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Tests
        run: npm test

  security-check:
    needs: test
    uses: ./.github/workflows/security-template.yml # FIXED: Removed @main

  secret-check:
    needs: security-check
    uses: ./.github/workflows/secret-detector.yml # FIXED: Removed @main from pipeline

  ai-review:
    needs: secret-check
    uses: ./.github/workflows/ai-issue-generator.yml
    # ADD THIS SECTION:
    with:
      title: "Security Alert: Automated Scan Detection"
      message: "The pipeline has completed its scan. Please check the Codex summary and Gitleaks logs for details."
