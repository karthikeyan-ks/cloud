name: Node js CI/CD pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # This tells GitHub to remember your packages

      - name: Install dependencies
        run: npm ci # Faster and more reliable than 'npm install' for CI

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Re-uses the cache from the build job

      - name: Install dependencies
        run: npm ci # Uses the cache, so it's lightning fast

      - name: Run Tests
        run: npm test

  security-check:
    needs: test
    uses: ./.github/workflows/security-template.yml

  secret-check:
    needs: security-check
    uses: ./.github/workflows/secret-detector.yml

  ai-review:
    needs: secret-check
    uses: ./github/workflows/ai-issue-generator.yml